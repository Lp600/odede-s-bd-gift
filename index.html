<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 22nd Birthday Odede! 🎉</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Poppins', 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; overflow-x: hidden; text-align: center;
    color: #fff; position: relative;
  }
  .container { padding: 2rem 1rem;  z-index: 1; position: relative;}
  h1 {
    font-size: 2.8rem; margin: 1rem 0; font-weight: 800;
    background: linear-gradient(45deg, #f093fb, #f5576c, #4facfe, #00f2fe);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: bounce 2s infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .card {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px; padding: 2rem; margin: 1.5rem auto; max-width: 600px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  #age {
    font-size: 6rem; font-weight: 900; line-height: 1;
    background: linear-gradient(45deg, #feca57, #ff9ff3);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin: 0.5rem 0; text-shadow: 0 4px 20px rgba(254,202,87,0.5);
  }
  button {
    font-family: inherit; font-size: 1rem; padding: 0.9rem 1.8rem;
    border: none; border-radius: 50px; margin: 0.5rem; cursor: pointer;
    background: linear-gradient(45deg, #ff6b6b, #feca57); color: white; 
    font-weight: 600; transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(255,107,107,0.4);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255,107,107,0.6); }
  button:active { transform: scale(0.96); }
  textarea {
    width: 90%; padding: 1rem; border-radius: 16px; border: none;
    font-family: inherit; margin: 0.5rem 0; resize: none;
    background: rgba(255,255,255,0.9); color: #333;
  }
  /* Scrollable Gallery */
  .gallery {
    display: flex; overflow-x: auto; gap: 1rem; padding: 1rem 0.5rem;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  }
  .gallery::-webkit-scrollbar { height: 8px; }
  .gallery::-webkit-scrollbar-thumb { 
    background: rgba(255,255,255,0.4); border-radius: 10px; 
  }
  .gallery img {
    height: 200px; border-radius: 16px; scroll-snap-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.3s;
    object-fit: cover; min-width: 200px;
  }
  .gallery img:hover { transform: scale(1.05) rotate(1deg); }
   .balloon {
    position: absolute; width: 60px; height: 80px; border-radius: 50%;
    opacity: 0.6; animation: float 6s ease-in-out infinite; z-index: 0;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-25px) rotate(4deg); }
  }
  .confetti, .heart {
    position: fixed; pointer-events: none; z-index: 9999;
  }
  .wish {
    position: fixed; bottom: 20px; background: rgba(255,255,255,0.9); 
    color: #333; padding: 0.7rem 1.2rem; border-radius: 20px; 
    animation: floatUp 8s linear forwards; font-weight: 500;
  }
  @keyframes floatUp {
    to { transform: translateY(-100vh); opacity: 0; }
  }
  .subtitle { opacity: 0.9; margin-bottom: 1rem; font-size: 1.1rem; }
  
</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Happy Birthday Odede! 🎂</h1>
    <p class="subtitle">Level 22 Unlocked ✨</p>
    
    <div class="card">
      <div id="age">22</div>
      <p>To more wins, laughter, and good chaos this year 🥳</p>
      <p>Dedicated Birthday Song</p>
      <div><audio controls><source src="rehab.mp3" type="audio/mpeg" ></audio>
</div>
      <button onclick="confettiBlast()">🎉 Confetti Blast</button>
      <button id="gftBtn"> 🎊Click for Virtual Gift</button>
    </div>

    <div class="card">
      <h3>Odede's Moments 📸</h3>
      <p class="subtitle">A Mini Album For You</p>
      <div class="gallery">
        <img src="mes-odede.jpg" alt="Memory 1">
        <img src="one.jpg" alt="Fav">
        <img src="two.jpg" alt="Memory 2">
        <img src="three.jpg" alt="Memory 3">
        <img src="four.jpg" alt="Memory 4">
        <img src="five.jpg" alt="Memory 5">
      </div>
    </div>

    <div class="card">
      <h3>Wish Jar for Odede 🏮</h3>
      <textarea id="wishInput" rows="2" placeholder="Drop Your birthday wish here..."></textarea><br>
      <button onclick="sendWish()">Send Wish to the Sky</button>
    </div>

    <p style="margin-top:2rem; font-size:0.9rem; opacity:0.8">Made with love</p>
  </div>

  
<script>
  // Floating balloons on load
  function createBalloons() {
    const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#1dd1a1', '#f368e0'];
    for(let i=0; i<10; i++) {
      let balloon = document.createElement('div');
      balloon.className = 'balloon';
      balloon.style.background = colors[i % colors.length ];
      balloon.style.left = Math.random() * 95 + '%';
      balloon.style.top = Math.random() * 85 + 5 + '%';
      balloon.style.animationDelay = Math.random() * 6 + 's';
      balloon.style.animationDuration = Math.random() * 3 + 4 + 's';
      document.body.appendChild(balloon);
    }
  }
  createBalloons();

  // Confetti blast
  function confettiBlast() {
    for(let i=0; i<150; i++) {
      let confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.top = '-10px';
      confetti.style.width = Math.random() * 8 + 4 + 'px';
      confetti.style.height = confetti.style.width;
      confetti.style.background = `hsl(${Math.random()*360},100%,60%)`;
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(confetti);
      
      let fall = confetti.animate([
        { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
        { transform: `translateY(100vh) rotate(720deg)`, opacity: 0 }
      ], { duration: Math.random()*3000 + 2000, easing: 'cubic-bezier(.25,.46,.45,.94)' });
      fall.onfinish = () => confetti.remove();
    }
  }

  // Hearts on click
  document.addEventListener('click', function(e) {
    if(e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
    for(let i=0; i<6; i++) {
      let heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = ['💖','✨','🎉','🥳','💜'][Math.floor(Math.random()*5)];
      heart.style.left = e.clientX + (Math.random()*60-30) + 'px';
      heart.style.top = e.clientY + (Math.random()*60-30) + 'px';
      heart.style.fontSize = Math.random()*20 + 15 + 'px';
      document.body.appendChild(heart);
      
      let float = heart.animate([
        { transform: 'translateY(0) scale(1)', opacity: 1 },
        { transform: 'translateY(-120px) scale(0)', opacity: 0 }
      ], { duration: 1800 });
      float.onfinish = () => heart.remove();
    }
  });

  // Wish lantern
  function sendWish() {
    const wish = document.getElementById('wishInput').value.trim();
    if(!wish) return;
    let wishEl = document.createElement('div');
    wishEl.className = 'wish';
    wishEl.textContent = '🏮 ' + wish;
    wishEl.style.left = Math.random()*70 + 15 + '%';
    document.body.appendChild(wishEl);
    document.getElementById('wishInput').value = '';
    confettiBlast();
    setTimeout(() => wishEl.remove(), 8000);
  }

const giftButton = document.getElementById('gftBtn');


giftButton.addEventListener('click', function() {
    alert('Heyyyyyyyy, Odede, Babe, My love, Aswito—hata kama ulikataa hii😅. I can call you all the names in the world and promise you everything I have envisioned with you, but it would never erase the fact that we are doing this. We are doing us. Na hatuwezi neglect the fact that it is not easy, not in the slightest bit. What we give credit to is that we both are trying and doing the best in our books. And I wish you more and more years, mpaka time tutaona wajukuu. Happy birthday, My love. To infinity.💯');

});


  // Auto confetti on load
  window.onload = () => setTimeout(confettiBlast, 800);
</script>
</body>
</html>
